<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f4ec" />
    <style>html{background-color:#f7f4ec}html.theme-dark{background-color:#1c1f1d}</style>
    <script>
      (function () {
        try {
          var p = localStorage.getItem('rt-theme') || 'light';
          var dark = p === 'dark' || (p === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.classList.add(dark ? 'theme-dark' : 'theme-light');
          var s = localStorage.getItem('rt-tile-size') || 'm';
          r.classList.add('tiles-' + s);
        } catch (e) {
          document.documentElement.classList.add('theme-light');
        }
      })();
    </script>
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Riichi Mahjong Trainer</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
