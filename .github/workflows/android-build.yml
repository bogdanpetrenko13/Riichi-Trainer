name: Android APK

on:
  push:
    branches: [ develop, "stack-*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Exactly the versions in package-lock.json (refresh it with the
      # "Refresh package-lock.json" workflow after editing package.json).
      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type-check and build web app
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Add Android platform and sync
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          # App icon and splash screens (scripts/make-icons.py trainer)
          cp -r resources/android/res/. android/app/src/main/res/
          # Immersive full-screen activity (hides status and navigation bars)
          cp resources/android/java/MainActivity.java android/app/src/main/java/com/riichitrainer/app/MainActivity.java
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          # Fixed debug key (signing/debug.keystore, public android/android
          # credentials): every build installs over the previous one.
          ./gradlew assembleDebug --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signing/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Name APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/Riichi-Trainer-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Riichi-Trainer-debug-apk
          path: dist-apk/Riichi-Trainer-debug.apk
          if-no-files-found: error

      # The latest develop build as a pre-release asset (release assets can be
      # downloaded where workflow artifacts cannot).
      - name: Publish dev-latest pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create dev-latest dist-apk/Riichi-Trainer-debug.apk -R "$GITHUB_REPOSITORY" \
            --prerelease --target "$GITHUB_SHA" --title "Dev build (latest develop)" \
            --notes "Debug APK from ${GITHUB_SHA::7}. Replaced on every push to develop."
