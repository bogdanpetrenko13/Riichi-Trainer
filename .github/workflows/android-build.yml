name: Android APK

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # CRA 3 (webpack 4) на Node 17+ требует legacy OpenSSL
      NODE_OPTIONS: --openssl-legacy-provider
      # Чтобы ESLint-предупреждения не ломали сборку CRA
      CI: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Add Android platform (if not committed to the repo)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Configure Android project (minSdk 24, app name, version)
        run: |
          sed -i -E 's/minSdkVersion *= *[0-9]+/minSdkVersion = 24/' android/variables.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i -E 's#<string name="app_name">[^<]*</string>#<string name="app_name">Riichi Trainer</string>#' android/app/src/main/res/values/strings.xml
          sed -i -E 's#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">Riichi Trainer</string>#' android/app/src/main/res/values/strings.xml
          grep -n "minSdkVersion" android/variables.gradle
          grep -n "versionCode" android/app/build.gradle

      - name: Generate app icons from the project icon
        continue-on-error: true
        run: |
          python3 -m venv /tmp/iconvenv
          /tmp/iconvenv/bin/pip install --quiet pillow
          mkdir -p assets
          /tmp/iconvenv/bin/python - <<'PY'
          from PIL import Image
          img = Image.open("public/icon-512.png").convert("RGBA")
          img = img.resize((1024, 1024), Image.LANCZOS)
          img.save("assets/icon.png")
          PY
          npx --yes @capacitor/assets@3 generate --android \
            --iconBackgroundColor '#6C979B' --iconBackgroundColorDark '#6C979B'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug and release APK (Gradle)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare output directory
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Riichi-Trainer-debug.apk

      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="$RUNNER_TEMP/app-release-aligned.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing release with your keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD \
              --out dist/Riichi-Trainer-release.apk "$ALIGNED"
          else
            echo "::warning::Secrets not set - signing release with the DEBUG key (installable, but not for Play Store)"
            "$BT/apksigner" sign \
              --ks "$HOME/.android/debug.keystore" \
              --ks-pass pass:android \
              --ks-key-alias androiddebugkey \
              --key-pass pass:android \
              --out dist/Riichi-Trainer-release.apk "$ALIGNED"
          fi
          "$BT/apksigner" verify --print-certs dist/Riichi-Trainer-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Riichi-Trainer-debug-apk
          path: dist/Riichi-Trainer-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Riichi-Trainer-release-apk
          path: dist/Riichi-Trainer-release.apk
          if-no-files-found: error
